<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日新闻简报</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236c3bf4'/><text y='72' x='50' font-size='62' text-anchor='middle' fill='white' font-family='sans-serif'>报</text></svg>">
<style>
  :root{
    --bg:#f4f6ff;
    --bg2:#eef1ff;
    --card:#ffffff;
    --ink:#14142b;
    --sub:#6b6b8a;

    --violet:#6c3bf4;
    --violet-2:#8b5cf6;
    --pink:#ff3d8b;
    --orange:#ff7a29;
    --cyan:#00c2d7;
    --lime:#00c48c;
    --yellow:#ffc531;

    --line:#e6e6f5;
    --shadow-s:0 1px 2px rgba(20,20,43,.05);
    --shadow-m:0 2px 6px rgba(20,20,43,.06), 0 10px 28px rgba(108,59,244,.10);
    --shadow-l:0 4px 10px rgba(20,20,43,.07), 0 18px 44px rgba(108,59,244,.16);
    --r:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(900px 480px at 8% -8%, #ff3d8b1f, transparent 60%),
      radial-gradient(800px 440px at 96% 4%, #00c2d71f, transparent 60%),
      radial-gradient(760px 420px at 50% 100%, #6c3bf41c, transparent 60%);
    background-attachment:fixed;
    color:var(--ink);
    font:400 16px/1.72 -apple-system,BlinkMacSystemFont,"Segoe UI",
         "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px 90px}

  /* ---------- 顶栏 ---------- */
  header{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:20px;flex-wrap:wrap;
    padding:54px 0 24px;margin-bottom:34px;
    border-bottom:2px solid var(--ink);
  }
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:13px;flex:none;
    background:linear-gradient(135deg,var(--violet),var(--pink) 55%,var(--orange));
    box-shadow:0 6px 18px rgba(108,59,244,.34);
    display:grid;place-items:center;
    font-size:23px;
  }
  .masthead h1{
    font-size:34px;font-weight:600;letter-spacing:-.6px;line-height:1.15;
    background:linear-gradient(100deg,var(--violet),var(--pink));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .meta{
    margin-top:7px;color:var(--sub);font-size:13.5px;
    display:flex;gap:11px;flex-wrap:wrap;align-items:center;
  }
  .dot{width:3px;height:3px;border-radius:50%;background:var(--sub);opacity:.5}
  .live{
    display:inline-flex;align-items:center;gap:5px;
    color:var(--lime);font-weight:600;font-size:12.5px;
  }
  .live i{width:6px;height:6px;border-radius:50%;background:var(--lime);
    box-shadow:0 0 0 3px rgba(0,196,140,.2);animation:pulse 2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(0,196,140,0)}}

  .actions{display:flex;gap:10px;align-items:center}
  button{
    font:inherit;font-size:14px;font-weight:500;cursor:pointer;border:none;
    border-radius:11px;padding:10px 20px;transition:.2s;color:#fff;
    background:linear-gradient(135deg,var(--violet),var(--violet-2));
    box-shadow:0 4px 14px rgba(108,59,244,.30);
  }
  button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 22px rgba(108,59,244,.40)}
  button:active:not(:disabled){transform:translateY(0)}
  button:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
  button.ghost{
    background:#fff;color:var(--violet);
    box-shadow:inset 0 0 0 2px var(--line);border:1px solid var(--line);
  }
  button.ghost:hover:not(:disabled){background:var(--bg2);box-shadow:inset 0 0 0 2px var(--violet)}

  /* ---------- 进度 ---------- */
  #bar{height:3px;border-radius:3px;background:var(--line);overflow:hidden;
       margin:-34px 0 28px;opacity:0;transition:opacity .3s}
  #bar.on{opacity:1}
  #bar i{display:block;height:100%;width:38%;
    background:linear-gradient(90deg,var(--violet),var(--pink),var(--orange));
    animation:slide 1.15s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-38%}100%{margin-left:100%}}

  /* ---------- 区块 ---------- */
  section{margin-bottom:46px}
  .sec-title{
    display:flex;align-items:center;gap:11px;margin-bottom:20px;
    font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--sub);
  }
  .sec-title::before{
    content:"";width:5px;height:20px;border-radius:3px;
    background:linear-gradient(180deg,var(--violet),var(--pink));
  }
  .sec-title .count{
    margin-left:auto;letter-spacing:0;text-transform:none;font-weight:500;
    background:var(--bg2);color:var(--violet);padding:3px 11px;border-radius:99px;
  }

  /* ---------- 头条 ---------- */
  .highlights{display:grid;gap:15px}
  .hl{
    background:var(--card);border-radius:var(--r);padding:24px 26px;
    box-shadow:var(--shadow-m);text-decoration:none;color:inherit;display:block;
    border-left:5px solid var(--violet);transition:.24s;position:relative;overflow:hidden;
  }
  .hl::after{
    content:"";position:absolute;inset:0;border-radius:var(--r);
    background:linear-gradient(105deg,rgba(108,59,244,.05),transparent 42%);
    opacity:0;transition:.24s;pointer-events:none;
  }
  .hl:hover{transform:translateY(-3px);box-shadow:var(--shadow-l)}
  .hl:hover::after{opacity:1}
  .hl:nth-child(1){border-left-color:var(--pink)}
  .hl:nth-child(2){border-left-color:var(--orange)}
  .hl:nth-child(3){border-left-color:var(--cyan)}
  .hl .n{
    display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.1em;
    color:#fff;padding:3px 11px;border-radius:99px;margin-bottom:11px;
    background:linear-gradient(135deg,var(--violet),var(--pink));
  }
  .hl:nth-child(2) .n{background:linear-gradient(135deg,var(--orange),var(--yellow))}
  .hl:nth-child(3) .n{background:linear-gradient(135deg,var(--cyan),var(--lime))}
  .hl h3{font-size:19.5px;font-weight:600;line-height:1.48;margin-bottom:9px}
  .hl p{color:var(--sub);font-size:14.5px;line-height:1.72}
  .hl .src{margin-top:13px;font-size:12.5px;font-weight:500;
    display:inline-block;padding:4px 11px;border-radius:99px;
    background:var(--bg2);color:var(--violet)}

  /* ---------- 分类 ---------- */
  .cat-grid{display:grid;gap:20px;grid-template-columns:repeat(2,1fr)}
  .cat{
    background:var(--card);border-radius:var(--r);padding:22px 24px;
    box-shadow:var(--shadow-m);
    border-top:4px solid var(--violet);transition:.24s;
  }
  .cat:hover{box-shadow:var(--shadow-l);transform:translateY(-2px)}
  .cat.c1{border-top-color:var(--violet)}
  .cat.c2{border-top-color:var(--pink)}
  .cat.c3{border-top-color:var(--orange)}
  .cat.c4{border-top-color:var(--cyan)}
  .cat.c5{border-top-color:var(--lime)}
  .cat h4{
    display:flex;align-items:center;gap:9px;
    font-size:16.5px;font-weight:600;margin-bottom:15px;padding-bottom:12px;
    border-bottom:1px solid var(--line);
  }
  .cat h4 .dotmark{width:9px;height:9px;border-radius:3px;background:var(--violet)}
  .cat.c2 .dotmark{background:var(--pink)}
  .cat.c3 .dotmark{background:var(--orange)}
  .cat.c4 .dotmark{background:var(--cyan)}
  .cat.c5 .dotmark{background:var(--lime)}
  .cat h4 em{
    margin-left:auto;font-style:normal;font-size:12px;font-weight:600;
    background:var(--bg2);color:var(--sub);padding:2px 10px;border-radius:99px;
  }
  .cat ul{list-style:none;display:grid;gap:12px}
  .cat li a,.cat li .static{
    color:inherit;text-decoration:none;display:block;padding-left:16px;
    position:relative;transition:.16s;
  }
  .cat li a::before,.cat li .static::before{
    content:"";position:absolute;left:0;top:9px;width:6px;height:6px;
    border-radius:2px;background:linear-gradient(135deg,var(--violet),var(--pink));
  }
  .cat li a:hover{color:var(--violet);transform:translateX(3px)}
  .cat .t{font-size:14.5px;line-height:1.55;font-weight:500}
  .cat .d{color:var(--sub);font-size:13.5px;line-height:1.62;margin-top:3px}

  /* ---------- 值得关注 ---------- */
  .watch{
    background:linear-gradient(120deg,#fff6fb,#fff9f2 60%,#f4f9ff);
    border-radius:var(--r);padding:24px 26px;
    box-shadow:var(--shadow-m);border-left:5px solid var(--pink);
  }
  .watch .lb{
    display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.1em;
    color:#fff;background:linear-gradient(135deg,var(--pink),var(--orange));
    padding:3px 11px;border-radius:99px;margin-bottom:11px;
  }
  .watch h4{font-size:17.5px;font-weight:600;margin-bottom:7px}
  .watch p{color:#7a5570;font-size:14.5px;line-height:1.72}

  /* ---------- 筛选提示条 ---------- */
  .filterbar{
    background:rgba(108,59,244,.09);border:1px solid rgba(108,59,244,.22);
    border-radius:12px;padding:12px 20px;margin-bottom:26px;
    font-size:14px;color:var(--violet);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .filterbar b{font-weight:600}
  .filterbar button{
    margin-left:auto;font-size:13px;padding:6px 15px;
    background:#fff;color:var(--violet);box-shadow:inset 0 0 0 1.5px var(--violet);
  }
  .filterbar button:hover{background:var(--violet);color:#fff;box-shadow:none}

  /* ---------- 搜索 ---------- */
  .search{
    background:linear-gradient(130deg,var(--violet),#7c4bf5 45%,var(--pink));
    border-radius:var(--r);padding:26px;margin-bottom:44px;
    box-shadow:0 8px 30px rgba(108,59,244,.28);color:#fff;
  }
  .search h4{font-size:17px;font-weight:600;margin-bottom:6px;
    display:flex;align-items:center;gap:8px}
  .search p{opacity:.9;font-size:13.5px;margin-bottom:17px;line-height:1.68}
  .search form{display:flex;gap:10px}
  .search input{
    flex:1;font:inherit;font-size:14.5px;padding:12px 17px;border-radius:11px;
    border:none;background:rgba(255,255,255,.96);color:var(--ink);outline:none;
  }
  .search input:focus{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
  .search button{
    background:#fff;color:var(--violet);box-shadow:none;flex:none;
  }
  .search button:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .search button.ghost2{
    background:rgba(255,255,255,.18);color:#fff;
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45);
  }
  .search button.ghost2:hover{background:rgba(255,255,255,.30);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
  .hits{margin-top:15px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{
    font-size:12.5px;font-weight:500;
    background:rgba(255,255,255,.22);color:#fff;
    padding:5px 13px;border-radius:99px;border:1px solid rgba(255,255,255,.3);
  }
  .hits .lab{font-size:12.5px;opacity:.85;margin-right:2px}

  /* ---------- 状态 ---------- */
  .status{
    padding-top:20px;border-top:1px solid var(--line);color:var(--sub);
    font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;
    justify-content:space-between;align-items:center;
  }
  .status b{color:var(--violet);font-weight:600}
  .badge{
    display:inline-flex;align-items:center;gap:6px;font-weight:600;
    color:var(--lime);background:rgba(0,196,140,.1);
    padding:4px 12px;border-radius:99px;
  }

  .toast{
    position:fixed;bottom:30px;left:50%;transform:translate(-50%,90px);
    background:var(--ink);color:#fff;padding:12px 26px;border-radius:99px;
    font-size:14px;opacity:0;transition:.3s;z-index:99;pointer-events:none;
    box-shadow:0 10px 30px rgba(20,20,43,.3);
  }
  .toast.on{transform:translate(-50%,0)}

  /* ---------- 问答 ---------- */
  .qa-wrap{display:none}
  .qa-wrap.on{display:block}
  .brief-wrap.off{display:none}

  .qa-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:14px;flex-wrap:wrap;margin-bottom:20px;
    padding-bottom:14px;border-bottom:1px solid var(--line);
  }
  .qa-head h2{font-size:19px;font-weight:600}
  .qa-head .hint{font-size:13px;color:var(--sub)}

  .qa-list{display:grid;gap:18px;margin-bottom:24px}
  .bub{max-width:88%;padding:16px 20px;border-radius:16px;line-height:1.78;font-size:15px}
  .bub.q{
    background:linear-gradient(135deg,var(--violet),var(--pink));
    color:#fff;margin-left:auto;border-bottom-right-radius:5px;
    box-shadow:0 4px 16px rgba(108,59,244,.24);
  }
  .bub.a{
    background:var(--card);border:1px solid var(--line);
    border-bottom-left-radius:5px;box-shadow:var(--shadow-m);color:var(--ink);
  }
  .bub.a.wait{display:flex;align-items:center;gap:12px;color:var(--sub)}
  .bub.a.err{background:rgba(255,61,139,.06);border-color:rgba(255,61,139,.25);color:var(--ink)}
  .bub .kw{
    display:inline-block;font-size:11.5px;color:var(--violet);
    background:rgba(108,59,244,.09);padding:3px 10px;border-radius:99px;
    margin-bottom:10px;font-weight:500;
  }
  .bub .kw.know{
    color:#0b6fb8;background:rgba(0,140,220,.10);
  }
  .bub .kw.thin{
    color:var(--orange);background:rgba(255,122,41,.12);
  }
  .bub a{color:var(--violet);text-decoration:none;font-weight:500}
  .bub a:hover{text-decoration:underline}
  .refs{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .refs .rt{font-size:11.5px;color:var(--sub);margin-bottom:7px;letter-spacing:.05em}
  .refs a{display:block;font-size:13px;color:var(--sub);
    padding:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .refs a:hover{color:var(--violet)}

  .askbox{
    background:linear-gradient(130deg,var(--violet),#7c4bf5 45%,var(--pink));
    border-radius:var(--r);padding:20px;box-shadow:0 8px 30px rgba(108,59,244,.26);
  }
  .askbox form{display:flex;gap:10px}
  .askbox input{
    flex:1;font:inherit;font-size:15px;padding:13px 18px;border-radius:12px;
    border:none;background:#fff;color:var(--ink);outline:none;
  }
  .askbox input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.4)}
  .askbox button{background:#fff;color:var(--violet);box-shadow:none;flex:none;padding:13px 26px}
  .examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .examples .chip{cursor:pointer;transition:.15s}
  .examples .chip:hover{background:rgba(255,255,255,.34)}

  /* ---------- 空态 ---------- */
  .empty{text-align:center;padding:100px 20px;color:var(--sub)}
  .empty h3{font-size:19px;font-weight:600;color:var(--ink);margin-bottom:9px}
  .empty p{max-width:460px;margin:0 auto;line-height:1.7}
  .empty.err{background:rgba(255,61,139,.05);border:1px solid rgba(255,61,139,.18);
    border-radius:var(--r);padding:56px 24px;margin-bottom:8px}
  .erricon{
    width:44px;height:44px;border-radius:50%;margin:0 auto 18px;
    background:linear-gradient(135deg,var(--pink),var(--orange));
    color:#fff;font-size:24px;font-weight:600;
    display:grid;place-items:center;
  }
  .empty.err h3{color:var(--pink)}
  .empty.err button{margin-top:22px}
  .elapsed{
    margin-top:10px;font-size:12.5px;color:var(--violet);
    background:rgba(108,59,244,.08);display:inline-block;
    padding:4px 14px;border-radius:99px;
  }
  .status .warn{
    color:var(--orange);background:rgba(255,122,41,.1);
    padding:4px 12px;border-radius:99px;font-weight:500;
  }
  .spinner{
    width:34px;height:34px;border:3px solid var(--line);
    border-top-color:var(--violet);border-right-color:var(--pink);
    border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 22px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:720px){
    .wrap{padding:0 18px 60px}
    header{padding:34px 0 20px}
    .masthead h1{font-size:25px}
    .logo{width:38px;height:38px;border-radius:11px;font-size:19px}
    .cat-grid{grid-template-columns:1fr}
    .hl{padding:20px 21px}
    .hl h3{font-size:17.5px}
    .tell form{flex-direction:column}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">◈</div>
      <div class="masthead">
        <h1>每日新闻简报</h1>
        <div class="meta" id="meta"></div>
      </div>
    </div>
    <div class="actions">
      <button id="refresh">重新生成</button>
    </div>
  </header>

  <div id="bar"><i></i></div>

  <!-- ===== 早报视图（默认） ===== -->
  <div class="brief-wrap" id="briefView">
    <div id="content"><div class="empty">
      <div class="spinner"></div>
      <h3>正在采集今天的新闻…</h3>
      <p>首次启动需抓取 RSS 并由大模型归纳，约 20 秒</p>
    </div></div>
  </div>

  <!-- ===== 问答视图 ===== -->
  <div class="qa-wrap" id="qaView">
    <div class="qa-head">
      <h2>今日新闻问答</h2>
      <div style="display:flex;gap:10px;align-items:center">
        <span class="hint">基于今日新闻库作答</span>
        <button class="ghost" onclick="backToBrief()">回到早报</button>
      </div>
    </div>
    <div class="qa-list" id="qaList"></div>
    <div class="askbox">
      <form id="askForm">
        <input id="q" placeholder="问我任何今日新闻问题，例如：宁德时代最近怎么了？" autocomplete="off">
        <button type="submit">提问</button>
      </form>
      <div class="examples">
        <span class="lab" style="font-size:12.5px;opacity:.85;align-self:center">试试：</span>
        <span class="chip" onclick="quickAsk('芯片行业今天有什么动静？')">芯片行业有什么动静</span>
        <span class="chip" onclick="quickAsk('A股今天表现如何？')">A股今天怎么样</span>
        <span class="chip" onclick="quickAsk('特斯拉有什么新消息？')">特斯拉有什么消息</span>
        <span class="chip" onclick="quickAsk('今天有哪些国际新闻？')">今天的国际新闻</span>
      </div>
    </div>
  </div>

  <!-- ===== 底部入口 ===== -->
  <div class="search" id="askEntry">
    <h4>问我任何新闻问题</h4>
    <p>我会基于今天的新闻库回答，每条结论都附来源</p>
    <form id="f">
      <input id="kw" placeholder="例如：宁德时代最近怎么了？A股今天怎么样？" autocomplete="off">
      <button type="submit">提问</button>
      <button type="button" class="ghost2" id="reset">看早报</button>
    </form>
    <div class="hits">
      <span class="lab">热门话题：</span>
      <span class="chip" onclick="quickAsk('芯片行业今天有什么动静？')" style="cursor:pointer">芯片</span>
      <span class="chip" onclick="quickAsk('A股今天表现如何？')" style="cursor:pointer">A股</span>
      <span class="chip" onclick="quickAsk('特斯拉有什么新消息？')" style="cursor:pointer">特斯拉</span>
      <span class="chip" onclick="quickAsk('今天有哪些国际新闻？')" style="cursor:pointer">国际</span>
      <span class="chip" onclick="quickAsk('固态电池有什么进展？')" style="cursor:pointer">固态电池</span>
      <span class="chip" onclick="quickAsk('AI行业有什么新动态？')" style="cursor:pointer">AI</span>
    </div>
  </div>

  <div class="status" id="status"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let pollTimer=null;
let _poolSize=0;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATC=['c1','c2','c3','c4','c5'];

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400)}
function busy(on){$('#bar').classList.toggle('on',on);$('#refresh').disabled=on;
  $('#refresh').textContent=on?'生成中…':'重新生成'}

function render(d){
  const kw = d.keyword||'';
  $('#meta').innerHTML=`<span>${esc(d.date)}</span><i class="dot"></i>
    <span>${esc(d.weekday)}</span><i class="dot"></i>
    <span>${esc(d.generated_at)} 更新</span><i class="dot"></i>
    ${kw?`<span class="live"><i></i>筛选：${esc(kw)}</span>`
        :`<span class="live"><i></i>全量</span>`}`;
  let h='';

  if(kw){
    h+=`<div class="filterbar">当前只看 <b>${esc(kw)}</b> 相关 · 命中 ${d.stats.matched||0} 条
      <button onclick="doReset()">看全部新闻</button></div>`;
  }

  if(d.highlights?.length){
    h+=`<section><div class="sec-title">今日焦点<span class="count">${d.highlights.length} 条</span></div><div class="highlights">`;
    d.highlights.forEach((x,i)=>{
      const inner=`<div class="n">焦点 0${i+1}</div><h3>${esc(x.title)}</h3>`+
        `<p>${esc(x.digest)}</p>`+
        (x.source?`<div class="src">${esc(x.source)}</div>`:'');
      h+=x.link
        ?`<a class="hl" href="${esc(x.link)}" target="_blank" rel="noopener">${inner}</a>`
        :`<div class="hl">${inner}</div>`;
    });
    h+=`</div></section>`;
  }

  if(d.sections?.length){
    const n=d.sections.reduce((a,s)=>a+(s.items?.length||0),0);
    h+=`<section><div class="sec-title">分类速览<span class="count">${n} 条</span></div><div class="cat-grid">`;
    d.sections.forEach((s,i)=>{
      h+=`<div class="cat ${CATC[i%5]}">
        <h4><span class="dotmark"></span>${esc(s.category)}<em>${s.items?.length||0} 条</em></h4><ul>`;
      (s.items||[]).forEach(it=>{
        const body=`<div class="t">${esc(it.title)}</div>`+
          (it.digest?`<div class="d">${esc(it.digest)}</div>`:'');
        h+=it.link
          ?`<li><a href="${esc(it.link)}" target="_blank" rel="noopener">${body}</a></li>`
          :`<li><div class="static">${body}</div></li>`;
      });
      h+=`</ul></div>`;
    });
    h+=`</div></section>`;
  }



  $('#content').innerHTML=h||`<div class="empty"><h3>今天没生成出内容</h3><p>点右上角「重新生成」试试</p></div>`;

  const s=d.stats||{};
  _poolSize = s.pool||s.collected||0;
  const dead = s.dead_sources||[];
  $('#status').innerHTML=
    (dead.length
      ? `<span class="warn">⚠ ${dead.length} 个数据源失效：${esc(dead.join('、'))}</span>`
      : `<span class="badge">● ${s.sources_total||11} 个数据源全部正常</span>`)+
    `<span>本次 <b>${s.collected||0}</b> 条 · 耗时 <b>${s.elapsed||0}</b> 秒</span>`;
}

async function load(){
  try{
    const r=await fetch('/api/briefing');
    if(!r.ok) throw 0;
    const d=await r.json();
    if(d.error==='no_data'){
      const st=await (await fetch('/api/status')).json();
      showWorking(st.stage||'collecting',0);
      return false;
    }
    render(d);
    return true;
  }catch(e){
    //服务不可达：不再无限重试，明确告知
    $('#content').innerHTML=`<div class="empty err">
      <div class="erricon">!</div><h3>无法连接到服务</h3>
      <p>请确认程序仍在运行（重新双击 启动.bat 即可）</p>
      <button class="ghost" onclick="location.reload()">重新加载</button></div>`;
    return false;
  }
}

$('#refresh').onclick=async()=>{
  busy(true);
  await fetch('/api/refresh',{method:'POST'});
  $('#content').innerHTML=`<div class="empty"><div class="spinner"></div>
    <h3>正在重新生成…</h3><p>抓取 + 模型归纳，约 20 秒</p></div>`;
  clearTimeout(pollTimer); pollTimer=setTimeout(load,6000);
};

// 各阶段的中文提示
const STAGE_TEXT = {
  collecting: ['正在抓取新闻…', '从 11 个数据源并发获取，通常 2-3 秒'],
  matching:   ['正在筛选…', '在今日新闻池中匹配关键词'],
  llm:        ['模型归纳中…', '通常 5-10 秒，请稍候'],
  writing:    ['正在生成页面…', '马上就好'],
};

function showWorking(stage, elapsed){
  const [t, s] = STAGE_TEXT[stage] || ['处理中…',''];
  $('#content').innerHTML = `<div class="empty"><div class="spinner"></div>
    <h3>${esc(t)}</h3>
    <p>${esc(s)}</p>
    ${elapsed?`<p class="elapsed">已等待 ${Math.round(elapsed)} 秒</p>`:''}</div>`;
}

function showError(msg, kw){
  $('#content').innerHTML = `<div class="empty err">
    <div class="erricon">!</div>
    <h3>${esc(msg)}</h3>
    <p>今日新闻池共 ${_poolSize||0} 条，换个常见的词试试，比如「芯片」「AI」「市场」</p>
    <button class="ghost" onclick="doReset()">回到全部新闻</button>
  </div>`;
}

// 清除筛选，回到全量简报（供 filterbar / 错误页的按钮调用）
async function doReset(){
  toast('正在恢复全部新闻…');
  await fetch('/api/reset',{method:'POST'}).catch(()=>{});
  pollUntil('', '正在恢复全部新闻…');
}

function pollUntil(targetKw, label){
  busy(true);
  showWorking('collecting', 0);
  (async()=>{
    try{
      for(let i=0;i<100;i++){
        await new Promise(z=>setTimeout(z,800));
        const st = await (await fetch('/api/status')).json();
        if(st.stage==='done' && (st.keyword||'')===targetKw){
          const b = await (await fetch('/api/briefing')).json();
          render(b);
          toast(targetKw? `「${targetKw}」命中 ${st.matched} 条` : '已恢复全部新闻');
          break;
        }
        if(st.stage==='error'){ showError(st.error||'生成失败'); break; }
        showWorking(st.stage, (i+1)*0.8);
      }
    }finally{ busy(false); }
  })();
}

function backToBrief(){
  $('#qaView').classList.remove('on');
  $('#briefView').classList.remove('off');
  $('#askEntry').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function quickAsk(q){
  enterQA();
  $('#q').value = q;
  $('#askForm').dispatchEvent(new Event('submit',{cancelable:true}));
}

function enterQA(){
  $('#briefView').classList.add('off');
  $('#qaView').classList.add('on');
  $('#askEntry').style.display='none';
  if(!$('#qaList').children.length) welcomeQA();
}

function welcomeQA(){
  $('#qaList').innerHTML = `<div class="bub a">
    我会先查<strong>今日新闻库</strong>（今天抓取了 ${_poolSize||'—'} 条）。
    问到今天的新闻，我基于新闻回答并附上来源；
    问到新闻之外的（物理、历史、技术、常识等），我用<strong>自己的知识</strong>回答，
    并会明确标注<strong>那是通用知识、不是今日新闻</strong>。
    <br><br>你也可以追问，我会记得上文。</div>`;
}

function mdLite(s){
  if(!s) return '';
  let t = String(s);
  const keep=[];
  // 先摘出 markdown 标记，转义后再放回，避免 * 被esc 吃掉
  t = t.replace(/\*\*([^*\n]+?)\*\*/g,(m,g)=>{keep.push(`<strong>${g}</strong>`);return '\u0001';});
  t = t.replace(/(^|[^*\n])\*([^*\n]+?)\*/g,(m,a,g)=>{keep.push(`${a}<em>${g}</em>`);return '\u0001';});
  t = esc(t).replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
  return t.replace(/\u0001/g,()=>keep.shift()||'');
}

async function ask(q){
  const list=$('#qaList');
  list.insertAdjacentHTML('beforeend',`<div class="bub q">${esc(q)}</div>`);
  const waitId='w'+Date.now();
  list.insertAdjacentHTML('beforeend',
    `<div class="bub a wait" id="${waitId}"><div class="spinner" style="width:18px;height:18px;margin:0"></div>
     <span>正在查今日新闻…</span></div>`);
  $('#q').value='';
  list.scrollIntoView({behavior:'smooth',block:'end'});

  try{
    const r=await fetch('/api/ask',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
    const d=await r.json();
    const w=document.getElementById(waitId); if(w) w.remove();

    if(!d.ok){
      list.insertAdjacentHTML('beforeend',
        `<div class="bub a err">问不了：${esc(d.msg||'服务异常')}</div>`);
      return;
    }
    let h = '';
    const st = d.source_type || 'news';
    if(st === 'knowledge'){
      h += `<div class="kw know">📚 通用知识回答 · 非今日新闻</div>`;
    }else if(st === 'news_thin'){
      h += `<div class="kw thin">📰 今日新闻相关较少 · 命中 ${d.count} 条</div>`;
    }else if(d.keywords && d.keywords.length){
      h += `<div class="kw">检索：${esc(d.keywords.join(' · '))} ｜ 命中 ${d.count} 条 ｜ ${d.elapsed}s</div>`;
    }
    h += mdLite(d.answer||'（无回答）');
    if(d.refs && d.refs.length){
      h += `<div class="refs"><div class="rt">原文链接</div>`;
      d.refs.forEach(r=>{
        h += `<a href="${esc(r.link)}" target="_blank" rel="noopener">`
           +`[${esc(r.source)} ${esc(r.time)}] ${esc(r.title)}</a>`;
      });
      h += `</div>`;
    }
    list.insertAdjacentHTML('beforeend',`<div class="bub a">${h}</div>`);
    list.scrollIntoView({behavior:'smooth',block:'end'});
  }catch(e){
    const w=document.getElementById(waitId); if(w) w.remove();
    list.insertAdjacentHTML('beforeend',
      `<div class="bub a err">请求失败，请确认程序仍在运行</div>`);
  }
}

$('#askForm').onsubmit=e=>{
  e.preventDefault();
  const v=$('#q').value.trim();
  if(v) ask(v);
};

$('#f').onsubmit=async e=>{
  e.preventDefault();
  const v=$('#kw').value.trim();
  if(v) quickAsk(v);
};

$('#reset').onclick=backToBrief;

// 启动：有缓存直接渲染，无缓存则跟随状态轮询
(async()=>{
  const ok = await load();
  if(!ok){
    const st = await (await fetch('/api/status').catch(()=>({json:async()=>({stage:'idle'})}))).json();
    if(st.stage==='idle' || st.running) pollUntil('', '正在生成今日简报…');
  }
})();
</script>
